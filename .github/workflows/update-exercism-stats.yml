name: Update Exercism stats in README

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Make script executable
        run: chmod +x .github/scripts/update-exercism-stats.sh

      - name: Run update script
        env:
          GIT_AUTHOR_NAME: "Mathieu Prot"
          GIT_AUTHOR_EMAIL: "62431571+Rockvald@users.noreply.github.com"
        run: ./.github/scripts/update-exercism-stats.sh -p
